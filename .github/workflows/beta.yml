name: Beta

# Package beta-suffixed macOS DMG/ZIP on every push to develop (including PR merges).
#
# NOTE: Do NOT use workflow_run here. GitHub only schedules workflow_run listeners
# from workflow files that exist on the repository default branch (main). beta.yml
# lives on develop-first workflows and would never register as a listener on main.
on:
  push:
    branches: [develop]
  # Allow manual re-runs without another merge
  workflow_dispatch:

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.3.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Guard against OCWorkforces string (org does not exist; security risk)
        run: |
          if grep -rn "OCWorkforces" src/; then
            echo "ERROR: 'OCWorkforces' string found in src/ (org does not exist on GitHub)"
            exit 1
          fi
      - run: bun run typecheck
      - run: bun run typecheck:tests
      - run: bun run typecheck:sticky
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.3.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test

  package:
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - runs-on: macos-latest
            arch: arm64
          - runs-on: macos-15-intel
            arch: x64
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.3.0'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/.cache/electron
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-beta-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-electron-beta-
            ${{ runner.os }}-${{ matrix.arch }}-electron-

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-builder-beta-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-electron-builder-beta-
            ${{ runner.os }}-${{ matrix.arch }}-electron-builder-

      - run: bun install --frozen-lockfile
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron

      - run: bun run build
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron

      - name: Verify build artifacts
        run: |
          test -f lib/main/index.cjs || { echo 'ERROR: lib/main/index.cjs missing'; exit 1; }
          test -f lib/preload/index.cjs || { echo 'ERROR: lib/preload/index.cjs missing'; exit 1; }

      - name: Package macOS ${{ matrix.arch }}
        run: bunx electron-builder --mac --${{ matrix.arch }}
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append -beta suffix to DMG and ZIP filenames
        run: |
          set -euo pipefail
          shopt -s nullglob
          renamed=0
          for f in dist/*.dmg dist/*.zip; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            ext="${base##*.}"
            name="${base%.*}"
            # Skip if already suffixed (idempotent re-runs)
            if [[ "$name" == *-beta ]]; then
              echo "Already beta-suffixed: $f"
              continue
            fi
            dest="${dir}/${name}-beta.${ext}"
            echo "Renaming $f -> $dest"
            mv "$f" "$dest"
            renamed=$((renamed + 1))
          done
          if [ "$renamed" -eq 0 ]; then
            beta_count=$(find dist -maxdepth 1 \( -name '*-beta.dmg' -o -name '*-beta.zip' \) | wc -l | tr -d ' ')
            if [ "$beta_count" -eq 0 ]; then
              echo 'ERROR: No DMG/ZIP found to rename with -beta suffix'
              ls -la dist/ || true
              exit 1
            fi
          fi
          echo "Beta artifacts:"
          find dist -maxdepth 1 \( -name '*-beta.dmg' -o -name '*-beta.zip' \) | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-mac-beta-${{ matrix.arch }}
          path: |
            dist/*-beta.dmg
            dist/*-beta.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
