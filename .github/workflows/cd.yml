name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.3.0'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if tag / release already exists
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "git tag $TAG already present"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          # Softprops/partial failures can leave a tag without a usable release.
          # Only skip publish when a non-empty production release already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSET_COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "asset_count=${ASSET_COUNT}" >> "$GITHUB_OUTPUT"
            echo "GitHub release $TAG exists with ${ASSET_COUNT} asset(s)"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "asset_count=0" >> "$GITHUB_OUTPUT"
            echo "No GitHub release for $TAG yet (will publish even if tag exists)"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Resolve previous production tag
        id: prev
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.tag }}"
          # Production tags only: v1.2.3 (exclude beta prerelease tags)
          PREV=$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$CURRENT" \
            | head -n 1 || true)
          if [ -n "${PREV}" ]; then
            echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
            echo "previous production tag: ${PREV}"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "no previous production tag (first release notes range)"
          fi

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          PREV="${{ steps.prev.outputs.tag }}"
          TARGET="${{ github.event.workflow_run.head_sha }}"

          ARGS=(repos/${{ github.repository }}/releases/generate-notes -f "tag_name=${TAG}" -f "target_commitish=${TARGET}")
          if [ -n "${PREV}" ]; then
            ARGS+=(-f "previous_tag_name=${PREV}")
          fi

          RESPONSE=$(gh api "${ARGS[@]}")
          # Prefer GitHub-generated body; fall back to empty
          BODY=$(echo "$RESPONSE" | jq -r '.body // empty')
          NAME=$(echo "$RESPONSE" | jq -r --arg t "$TAG" '.name // $t')

          {
            echo "name<<EOF"
            echo "${NAME}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "## Amphetamine ${TAG}"
            echo ""
            echo "Production release from \`main\`."
            echo ""
            if [ -n "${PREV}" ]; then
              echo "Changes since **${PREV}**."
            else
              echo "Initial production release notes for this line."
            fi
            echo ""
            echo "---"
            echo ""
            if [ -n "${BODY}" ]; then
              echo "${BODY}"
            else
              echo "_No auto-generated commit range available._"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Skip only when a production release already has assets (not merely a git tag).
      # Tag-without-release happens when Publish fails mid-run after Create tag.
      - name: Skip re-release when production release already published
        id: skip_release
        if: steps.check_tag.outputs.release_exists == 'true' && steps.check_tag.outputs.asset_count != '0'
        run: |
          echo "Release ${{ steps.version.outputs.tag }} already has assets — skipping download/publish."
          echo "Bump package.json version for a new production release."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Download arm64 artifacts
        if: steps.skip_release.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: dist-mac-arm64
          path: artifacts/arm64

      - name: Download x64 artifacts
        if: steps.skip_release.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: dist-mac-x64
          path: artifacts/x64

      - name: Download Windows x64 artifacts
        if: steps.skip_release.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: dist-win-x64
          path: artifacts/win-x64

      - name: Download Windows arm64 artifacts
        if: steps.skip_release.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: dist-win-arm64
          path: artifacts/win-arm64

      - name: Verify release artifacts
        if: steps.skip_release.outputs.skip != 'true'
        run: |
          DMG_COUNT=$(find artifacts -name '*.dmg' 2>/dev/null | wc -l | tr -d ' ')
          ZIP_COUNT=$(find artifacts -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          EXE_COUNT=$(find artifacts -name '*.exe' 2>/dev/null | wc -l | tr -d ' ')
          echo "Found ${DMG_COUNT} DMG(s), ${ZIP_COUNT} ZIP(s), ${EXE_COUNT} EXE(s)"
          if [ "$DMG_COUNT" -eq 0 ] && [ "$ZIP_COUNT" -eq 0 ] && [ "$EXE_COUNT" -eq 0 ]; then
            echo 'ERROR: No DMG, ZIP, or EXE artifacts found to release'
            exit 1
          fi

      # electron-updater needs a single latest-mac.yml / latest.yml on the release.
      # Arch-matrix jobs each emit their own feed file with the same basename; merge
      # them before publish so GitHub assets stay unique and every arch is listed.
      - name: Merge multi-arch update feeds
        if: steps.skip_release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/update-feed

          mac_feeds=()
          [ -f artifacts/arm64/latest-mac.yml ] && mac_feeds+=(artifacts/arm64/latest-mac.yml)
          [ -f artifacts/x64/latest-mac.yml ] && mac_feeds+=(artifacts/x64/latest-mac.yml)
          if [ "${#mac_feeds[@]}" -eq 0 ]; then
            echo "ERROR: No latest-mac.yml in mac CI artifacts (Check for Updates will fail on macOS)"
            find artifacts -name '*.yml' -print || true
            exit 1
          elif [ "${#mac_feeds[@]}" -eq 1 ]; then
            cp "${mac_feeds[0]}" artifacts/update-feed/latest-mac.yml
          else
            bun run scripts/merge-latest-yml.ts "${mac_feeds[@]}" --out artifacts/update-feed/latest-mac.yml
          fi
          rm -f artifacts/arm64/latest-mac.yml artifacts/x64/latest-mac.yml

          win_feeds=()
          [ -f artifacts/win-x64/latest.yml ] && win_feeds+=(artifacts/win-x64/latest.yml)
          [ -f artifacts/win-arm64/latest.yml ] && win_feeds+=(artifacts/win-arm64/latest.yml)
          if [ "${#win_feeds[@]}" -eq 0 ]; then
            echo "ERROR: No latest.yml in Windows CI artifacts (Check for Updates will fail on Windows)"
            find artifacts -name '*.yml' -print || true
            exit 1
          elif [ "${#win_feeds[@]}" -eq 1 ]; then
            cp "${win_feeds[0]}" artifacts/update-feed/latest.yml
            rm -f artifacts/win-x64/latest.yml artifacts/win-arm64/latest.yml
          else
            bun run scripts/merge-latest-yml.ts "${win_feeds[@]}" --out artifacts/update-feed/latest.yml
            rm -f artifacts/win-x64/latest.yml artifacts/win-arm64/latest.yml
          fi

          # Drop all remaining yml from arch dirs so staging never double-uploads feeds
          # (builder-debug.yml, stray latest.yml from mac, etc.). Only update-feed keeps yml.
          find artifacts/arm64 artifacts/x64 artifacts/win-x64 artifacts/win-arm64 \
            -type f -name '*.yml' -delete 2>/dev/null || true

          echo "Staged update feeds:"
          ls -la artifacts/update-feed/ || true
          find artifacts -name '*.yml' | sort

      # softprops/gh upload by basename. Multi-arch dirs often share basenames.
      # Python staging: never fail on collisions (skip/prefer); fail only if feeds or
      # package binaries are missing. Inventory is logged for debug.
      - name: Stage unique release assets
        if: steps.skip_release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          echo "=== artifact inventory before staging ==="
          find artifacts -type f | sort || true
          python3 <<'PY'
          from __future__ import annotations

          import shutil
          import sys
          from pathlib import Path

          ROOT = Path("artifacts")
          STAGE = ROOT / "release-staging"
          FEED_DIR = ROOT / "update-feed"
          ARCH_DIRS = [
              ROOT / "arm64",
              ROOT / "x64",
              ROOT / "win-x64",
              ROOT / "win-arm64",
          ]
          BINARY_SUFFIXES = {".dmg", ".zip", ".exe", ".blockmap"}

          if STAGE.exists():
              shutil.rmtree(STAGE)
          STAGE.mkdir(parents=True)

          def is_arch_qualified(name: str) -> bool:
              return "arm64" in name or "x64" in name

          def stage_one(src: Path) -> None:
              base = src.name
              dest = STAGE / base
              if not dest.exists():
                  shutil.copy2(src, dest)
                  print(f"staged {base} <- {src}")
                  return
              if dest.read_bytes() == src.read_bytes():
                  print(f"skip identical {base} <- {src}")
                  return
              # Prefer arch-qualified names for package binaries.
              if not is_arch_qualified(base):
                  print(f"skip unqualified collision {base} <- {src}")
                  return
              if not is_arch_qualified(dest.name):
                  shutil.copy2(src, dest)
                  print(f"replace unqualified with {base} <- {src}")
                  return
              # Two different arch-qualified files with the same basename (rare).
              # Keep the first; do not fail the release.
              print(
                  f"WARN: keep first, skip conflicting arch-qualified {base} <- {src}",
                  file=sys.stderr,
              )

          mac_feed = FEED_DIR / "latest-mac.yml"
          win_feed = FEED_DIR / "latest.yml"
          if not mac_feed.is_file() or not win_feed.is_file():
              print("ERROR: expected merged feeds in artifacts/update-feed/", file=sys.stderr)
              if FEED_DIR.is_dir():
                  for p in sorted(FEED_DIR.iterdir()):
                      print(f"  {p}", file=sys.stderr)
              sys.exit(1)

          stage_one(mac_feed)
          stage_one(win_feed)

          binary_count = 0
          for arch_dir in ARCH_DIRS:
              if not arch_dir.is_dir():
                  print(f"WARN: missing artifact dir {arch_dir}")
                  continue
              for src in sorted(arch_dir.rglob("*")):
                  if not src.is_file():
                      continue
                  if src.suffix.lower() not in BINARY_SUFFIXES and not src.name.endswith(
                      ".blockmap"
                  ):
                      # .blockmap suffix is ".blockmap"; also allow "file.dmg.blockmap"
                      if ".blockmap" not in src.name:
                          continue
                  stage_one(src)
                  binary_count += 1

          staged_files = sorted(p for p in STAGE.iterdir() if p.is_file())
          print(f"Staged {len(staged_files)} unique asset(s) for upload:")
          for p in staged_files:
              print(f"  {p.name} ({p.stat().st_size} bytes)")

          has_feed = (STAGE / "latest-mac.yml").is_file() and (STAGE / "latest.yml").is_file()
          packages = [
              p
              for p in staged_files
              if p.suffix.lower() in {".dmg", ".zip", ".exe"}
          ]
          if not has_feed:
              print("ERROR: staged feeds missing", file=sys.stderr)
              sys.exit(1)
          if not packages:
              print("ERROR: no package binaries staged (.dmg/.zip/.exe)", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(packages)} package binary basename(s), feeds present")
          PY

      - name: Publish GitHub release
        if: steps.skip_release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: ${{ steps.notes.outputs.name }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          TARGET="${{ github.event.workflow_run.head_sha }}"
          BODY_FILE=$(mktemp)
          # Multiline body via env (Actions expands ${{ }} before bash runs).
          printf '%s\n' "$RELEASE_BODY" >"$BODY_FILE"

          mapfile -t FILES < <(find artifacts/release-staging -type f | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "ERROR: nothing in artifacts/release-staging"
            exit 1
          fi
          echo "Uploading ${#FILES[@]} asset(s) to $TAG (target $TARGET)"
          printf '  %s\n' "${FILES[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading/clobbering assets"
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file "$BODY_FILE" \
              --latest
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "${FILES[@]}" \
              --target "$TARGET" \
              --title "$RELEASE_TITLE" \
              --notes-file "$BODY_FILE" \
              --latest
          fi

          echo "Release assets after upload:"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort
          rm -f "$BODY_FILE"
