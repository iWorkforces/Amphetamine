name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.3.0'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Resolve previous production tag
        id: prev
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.tag }}"
          # Production tags only: v1.2.3 (exclude beta prerelease tags)
          PREV=$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$CURRENT" \
            | head -n 1 || true)
          if [ -n "${PREV}" ]; then
            echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
            echo "previous production tag: ${PREV}"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "no previous production tag (first release notes range)"
          fi

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          PREV="${{ steps.prev.outputs.tag }}"
          TARGET="${{ github.event.workflow_run.head_sha }}"

          ARGS=(repos/${{ github.repository }}/releases/generate-notes -f "tag_name=${TAG}" -f "target_commitish=${TARGET}")
          if [ -n "${PREV}" ]; then
            ARGS+=(-f "previous_tag_name=${PREV}")
          fi

          RESPONSE=$(gh api "${ARGS[@]}")
          # Prefer GitHub-generated body; fall back to empty
          BODY=$(echo "$RESPONSE" | jq -r '.body // empty')
          NAME=$(echo "$RESPONSE" | jq -r --arg t "$TAG" '.name // $t')

          {
            echo "name<<EOF"
            echo "${NAME}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "## Amphetamine ${TAG}"
            echo ""
            echo "Production release from \`main\`."
            echo ""
            if [ -n "${PREV}" ]; then
              echo "Changes since **${PREV}**."
            else
              echo "Initial production release notes for this line."
            fi
            echo ""
            echo "---"
            echo ""
            if [ -n "${BODY}" ]; then
              echo "${BODY}"
            else
              echo "_No auto-generated commit range available._"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download arm64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: dist-mac-arm64
          path: artifacts/arm64

      - name: Download x64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: dist-mac-x64
          path: artifacts/x64

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: dist-win-x64
          path: artifacts/win-x64

      - name: Download Windows arm64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: dist-win-arm64
          path: artifacts/win-arm64

      - name: Verify release artifacts
        run: |
          DMG_COUNT=$(find artifacts -name '*.dmg' 2>/dev/null | wc -l | tr -d ' ')
          ZIP_COUNT=$(find artifacts -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          EXE_COUNT=$(find artifacts -name '*.exe' 2>/dev/null | wc -l | tr -d ' ')
          echo "Found ${DMG_COUNT} DMG(s), ${ZIP_COUNT} ZIP(s), ${EXE_COUNT} EXE(s)"
          if [ "$DMG_COUNT" -eq 0 ] && [ "$ZIP_COUNT" -eq 0 ] && [ "$EXE_COUNT" -eq 0 ]; then
            echo 'ERROR: No DMG, ZIP, or EXE artifacts found to release'
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          # Body already includes API-generated notes; avoid double-append
          generate_release_notes: false
          make_latest: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
