<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>About Amphetamine</title>
  </head>
  <body>
    <div
      id="app"
      class="about"
      role="dialog"
      aria-labelledby="product-name"
      aria-describedby="version description"
    >
      <div class="icon-aurora-stage app-icon-stage">
        <div class="icon-aurora" aria-hidden="true">
          <span class="aurora-ring"></span>
          <span class="aurora-halo"></span>
          <span class="aurora-blob aurora-blob-a"></span>
          <span class="aurora-blob aurora-blob-b"></span>
          <span class="aurora-blob aurora-blob-c"></span>
          <span class="aurora-blob aurora-blob-d"></span>
          <span class="aurora-spark aurora-spark-1"></span>
          <span class="aurora-spark aurora-spark-2"></span>
          <span class="aurora-spark aurora-spark-3"></span>
        </div>
        <img
          id="app-icon"
          class="app-icon"
          alt=""
          draggable="false"
          role="button"
          tabindex="0"
          aria-label="View source on GitHub"
        />
      </div>
      <h1 id="product-name">Amphetamine</h1>
      <div id="version" class="version"></div>
      <div id="description" class="description"></div>
      <div id="copyright" class="copyright"></div>
      <button type="button" id="close-btn">OK</button>
    </div>
  </body>
</html>
